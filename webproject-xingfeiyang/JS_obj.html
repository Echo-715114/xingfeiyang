<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS内部对象</title>
</head>
<body>
    <script>
        // matn对象
        console.log(Math.floor(8.7)); // 向下取整
        console.log(Math.round(8.7)); // 四舍五入
        console.log(Math.random()); // [0,1)的随机数
        // 获取从min到max的随机数
        function getRandomNum(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }
        console.log(getRandomNum(100, 900)); // 输出100到900之间的随机数
        // Date对象
        var date = new Date();
        console.log(date.getFullYear()); // 获取年份
        console.log(date.getMonth() + 1); // 获取月份，注意月份是从0开始的，所以要加1
        console.log(date.getDate()); // 获取日期
        console.log(date.getDay()); // 获取星期几，0表示星期天，1表示星期一，以此类推
        console.log(date.getHours()+':'+date.getMinutes()+':'+date.getSeconds()); // 获取小时、分钟、秒数
        console.log(date.getMinutes()); // 获取分钟
        console.log(date.getSeconds()); // 获取秒数
        console.log(date.getTime()); // 获取时间戳（计算时间差），从1970年1月1日00:00:00到现在的毫秒数
        // 数组对象
        var arr = [1, 2, 3, 4,"five","six","seven"];
        var arr1 = new Array(1, 2, 3, 4,"five","six","seven");
        console.log(arr); 
        console.log(arr1);
        console.log(new Array(5)); // 创建一个长度为5的数组，元素为undefined
        var arr2 =Array.of(5);//创建一个长度为1的数组，元素为5
        console.log(arr2);

    </script>
</body>
</html>
