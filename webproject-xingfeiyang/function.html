<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS函数</title>
</head>
<body>
    <!-- 写一个随机数猜数游戏，计算机随机给出一定范围的随机数，学生输入猜测的数字，计算机给出猜的大或小，直到猜中或到达指定猜测次数。 -->
     <button onclick="gessNum()">猜猜我是几？</button>
     <script>
    // 匿名函数
        var gessNum = function () { 
            // Math.floor是取整，Math.random()是[0,1)的随机数
             let num = getRandomNum(1, 25);
             let count = 0;
             while (count < 5) {
                 let input = prompt("请输入数字：");
                
                 input = parseInt(input);
                 if (isNaN(input)) {
                     alert("请输入有效的数字！");
                     continue; 
                 }
                 if (input > num) {
                     alert("太大了！");
                 } else if (input < num) {
                     alert("太小了！");
                 } else {
                     alert("恭喜你，猜对了！");
                     return;
                 }
                 count++;
             }
             alert("游戏结束，正确答案是：" + num);
         }
// 获取从min到max的随机数
// 箭头函数
         var getRandomNum = (min, max) => {
            return Math.floor(Math.random() * (max - min + 1)) + min;
         }
     </script>
</body>
