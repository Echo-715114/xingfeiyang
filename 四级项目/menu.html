<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>侧边菜单</title>
<!-- 引入本地iconfont，和首页同一份 -->
<script src="images/font_5244147_o2xw7xghiud/iconfont.js"></script>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}
body{
    background:#fff;
    height:100vh;
    overflow-y:auto;
}
/* svg图标通用样式，和首页保持一致 */
.icon {
    width: 1em;
    height: 1em;
    vertical-align: -0.15em;
    fill: currentColor;
    overflow: hidden;
}
/* 和首页顶部栏：高度56px，样式完全统一 */
.topbar{
    width:100%;
    height:56px;
    background:#2185d0;
    color:white;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 16px;
    padding-top:env(safe-area-inset-top);
    font-size:20px;
}
.topbar-left{
    display:flex;
    align-items:center;
    gap:12px;
}
#closeBtn{
    cursor:pointer;
    font-size:22px;
}
.topbar-right{
    display:flex;
    gap:22px;
}
.menu-content{
    padding:0;
}
.menu-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    height:56px;/* 高度缩小，项目间距减小 */
    padding:0 20px;
    font-size:20px;
    cursor: pointer;
}
/* 后4个menu-row添加底部灰色分割线 */
.menu-row.has-border{
    border-bottom:1px solid #eee;
}
.menu-left{
    display:flex;
    align-items:center;
    gap:18px;
}
.menu-icon{
    font-size:22px;
    color:#888;
}
.menu-count{
    background:#f1f3f5;
    color:#666;
    padding:4px 10px;
    border-radius:6px;
    font-size:16px;
}
.menu-row.light{
    color:#888;
}
.menu-row.dark{
    color:#222;
}
.menu-row.dark .menu-icon{
    color:#444;
}
</style>
</head>
<body>
<div class="topbar">
    <div class="topbar-left">
        <!-- 左上角图标 -->
        <div id="closeBtn">
            <svg class="icon" aria-hidden="true">
                <use xlink:href="#icon-a-500576554-copy"></use>
            </svg>
        </div>
        <span>Days Matter · 倒数日</span>
    </div>
    <!-- 蓝色顶部栏右侧两个图标全部删除 -->
    <div class="topbar-right">
    </div>
</div>
<div class="menu-content">
    <!-- 前6个：无下边框 -->
    <div class="menu-row light" onclick="closeSide()">
        <div class="menu-left">
            <svg class="icon menu-icon" aria-hidden="true">
                <use xlink:href="#icon-shoucang"></use>
            </svg>
            <span>首页事件</span>
        </div>
        <span class="menu-count">4</span>
    </div>
    <div class="menu-row light">
        <div class="menu-left">
            <svg class="icon menu-icon" aria-hidden="true">
                <use xlink:href="#icon-a-500573245"></use>
            </svg>
            <span>全部</span>
        </div>
        <span class="menu-count">4</span>
    </div>
    <div class="menu-row light">
        <div class="menu-left">
            <svg class="icon menu-icon" aria-hidden="true">
                <use xlink:href="#icon-a-500571984"></use>
            </svg>
            <span>生活</span>
        </div>
        <span class="menu-count">2</span>
    </div>
    <div class="menu-row light">
        <div class="menu-left">
            <svg class="icon menu-icon" aria-hidden="true">
                <use xlink:href="#icon-a-500573247"></use>
            </svg>
            <span>工作</span>
        </div>
        <span class="menu-count">0</span>
    </div>
    <div class="menu-row light">
        <div class="menu-left">
            <svg class="icon menu-icon" aria-hidden="true">
                <use xlink:href="#icon-xiai"></use>
            </svg>
            <span>纪念日</span>
        </div>
        <span class="menu-count">2</span>
    </div>
    <div class="menu-row light">
        <div class="menu-left">
            <svg class="icon menu-icon" aria-hidden="true">
                <use xlink:href="#icon-bianji"></use>
            </svg>
            <span>管理本子</span>
        </div>
    </div>

    <!-- 后4个：添加 has-border 类，自带底部分隔线 -->
    <div class="menu-row dark has-border">
        <div class="menu-left">
            <svg class="icon menu-icon" aria-hidden="true">
                <use xlink:href="#icon-a-500573248"></use>
            </svg>
            <span>倒数本</span>
        </div>
    </div>
    <div class="menu-row dark has-border">
        <div class="menu-left">
            <svg class="icon menu-icon" aria-hidden="true">
                <use xlink:href="#icon-a-shijiankaishishijian1"></use>
            </svg>
            <span>历史上的今天</span>
        </div>
    </div>
    <div class="menu-row dark has-border">
        <div class="menu-left">
            <svg class="icon menu-icon" aria-hidden="true">
                <use xlink:href="#icon-wode"></use>
            </svg>
            <span>我的倒数日 · iCity</span>
        </div>
    </div>
    <div class="menu-row dark has-border">
        <div class="menu-left">
            <svg class="icon menu-icon" aria-hidden="true">
                <use xlink:href="#icon-qita-copy"></use>
            </svg>
            <span>更多</span>
        </div>
    </div>
</div>

<script>
// 关闭侧边栏函数：向父页面发送消息
function closeSide(){
    parent.postMessage('closeMenu','*');
}
// 点击左上角图标，通知父页面关闭侧边菜单，回到首页
document.getElementById('closeBtn').onclick = function(){
    closeSide();
}
// 已删除右上角加号对应的JS代码
</script>
</body>
</html>
