# 工作流名称：部署静态站点到 GitHub Pages
# 用途：每次推送到 master 后自动把整个工作区发布为 GitHub Pages 网站
name: Deploy static site to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch: # 支持在 GitHub 页面手动触发

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 检出课堂实践中心（GitHub 镜像仓库，作业集中在此）
        uses: actions/checkout@v4
        with:
          repository: Echo-715114/webproject-xingfeiyang
          ref: master
          path: webproject-xingfeiyang
      - name: 组装站点目录（主仓库内容 + 课堂实践中心，去掉嵌套 .git）
        run: |
          mkdir -p _site
          for item in $(ls -A | grep -vE '^(\.git$|\.github$|_site$|webproject-xingfeiyang$)'); do cp -a "$item" _site/; done
          cp -a webproject-xingfeiyang _site/
          rm -rf _site/webproject-xingfeiyang/.git
          # 上传工具只认 git 跟踪的文件，强制把 _site 纳入索引
          git add -f _site
      - name: 配置 Pages（自动开启站点）
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: 上传站点文件
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: 部署
        id: deployment
        uses: actions/deploy-pages@v4
