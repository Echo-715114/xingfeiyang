# 工作流名称：部署静态站点到 GitHub Pages（gh-pages 分支模式）
# 用途：每次推送到 master 后自动组装站点并推送到 gh-pages 分支，Pages 从该分支发布
name: Deploy static site to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch: # 支持在 GitHub 页面手动触发

permissions:
  contents: write # 需要 write 权限推送 gh-pages 分支

concurrency:
  group: gh-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 检出课堂实践中心（GitHub 镜像仓库，作业集中在此）
        uses: actions/checkout@v4
        with:
          repository: Echo-715114/webproject-xingfeiyang
          ref: master
          path: webproject-xingfeiyang
      - name: 组装站点目录（主仓库内容 + 课堂实践中心，去掉嵌套 .git）
        run: |
          mkdir -p _site
          for item in $(ls -A | grep -vE '^(\.git$|\.github$|_site$|webproject-xingfeiyang$)'); do cp -a "$item" _site/; done
          cp -a webproject-xingfeiyang _site/
          rm -rf _site/webproject-xingfeiyang/.git
          rm -f _site/.gitignore
      - name: 推送到 gh-pages 分支
        run: |
          cd _site
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "deploy: ${GITHUB_SHA::7}"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/Echo-715114/xingfeiyang.git" HEAD:gh-pages
