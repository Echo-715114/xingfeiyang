<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS对象</title>
    <!-- 类 实例就是对象，两要素：属性和方法
     学生的属性：学号、姓名、年龄、班级...
     方法：学习、睡觉、吃饭...（动作） -->
</head>
<body>
    <script>
        // 1.创建对象

            // 属性
        var student = {
            name: "张三",
            age: 18,
            sex: "男",
            class: "高三一班",
                // 数组：
            hobby: ["看电影", "足球", "看书"],
            // 方法
            study: function() {
                console.log("学习");
            },
            sleep: function() {
                console.log("睡觉");
            }
        };
        // 调用：
        console.log(student.name);
        console.log(student.study());
        // 删除对象方法：
        delete student.sleep;
        // 判断对象中是否有某个属性或方法：
        console.log("sleep" in student);
        // 对象的遍历：
        for (var key in student) {
            console.log(key,student[key]);
        }
        // 对象的赋值：（实质上是复制了引用地址，相当于起别名，多个变量可指向同一个对象）
        var o=student;
        console.log(o.name);
        o.name="王五";
        // 对象的引用类型（引用的是地址）
        console.log("o的名字"+o.name);
        console.log("student的名字"+student.name);

    </script>
    
</body>
</html>
